<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điều bất ngờ dành cho em... ❤️</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(135deg, #ffeef8 0%, #ffc0cb 100%); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; color: #fff; }
        #countdown { font-size: 160px; font-weight: 800; color: #ff4d6d; text-shadow: 0 10px 25px rgba(255, 77, 109, 0.3); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #love-screen { display: none; text-align: center; padding: 20px; max-width: 90%; }
        .heart { font-size: 160px; display: inline-block; color: #ff4d6d; animation: beat 0.8s infinite alternate cubic-bezier(0.25, 0.8, 0.25, 1); filter: drop-shadow(0 12px 20px rgba(255, 77, 109, 0.4)); }
        h1 { font-size: 38px; margin-top: 25px; margin-bottom: 15px; color: #ff4d6d; text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8); animation: fadeInUp 1.2s ease-in-out forwards; opacity: 0; }
        p { font-size: 22px; color: #6c757d; font-weight: 600; line-height: 1.5; animation: fadeInUp 1.8s ease-in-out forwards; opacity: 0; }
        @keyframes beat { to { transform: scale(1.18); } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="countdown">3</div>

    <div id="love-screen">
        <div class="heart">❤️</div>
        <h1>CÔNG CHÚA ƠI</h1>
        <p>LÀM VK CỦA CK NHÉ<br>CK YÊU VK NHIỀU LẮM</p>
    </div>

    <script>
        let count = 3;
        const countDiv = document.getElementById('countdown');
        const loveScreen = document.getElementById('love-screen');

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                countDiv.style.transform = "scale(0.3)";
                setTimeout(() => {
                    countDiv.innerText = count;
                    countDiv.style.transform = "scale(1)";
                }, 150);
            } else if (count === 0) {
                countDiv.style.transform = "scale(0.3)";
                setTimeout(() => {
                    countDiv.innerHTML = '<div class="heart">❤️</div>';
                    countDiv.style.transform = "scale(1)";
                }, 150);
            } else {
                clearInterval(timer);
                countDiv.style.opacity = '0';
                setTimeout(() => {
                    countDiv.style.display = 'none';
                    loveScreen.style.display = 'block';
                }, 200);
            }
        }, 1300);
    </script>
</body>
</html>
